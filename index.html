<!DOCTYPE html>
<html>
  <head>
    <title>StreamTV Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; background-color: black; overflow: hidden; }
      .player-wrapper { position: relative; height: 100vh; width: 100%; }
      video { width: 100%; height: 100%; object-fit: contain; }
      /* Estilo para que el spinner se vea centrado */
      .loader-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #111827; z-index: 999; }
    </style>
  </head>
  <body class="bg-gray-900 text-white">
    
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <script>
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>

    <script src="m3u_data.js"></script>
    <script type="text/babel" src="tvuno.jsx"></script>
    
  </body>
</html>
