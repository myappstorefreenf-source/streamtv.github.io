    <script>
        // --- PUENTE NATIVO CON ANDROID ---

window.reproducir = function(item) {
    if (!item || !item.url) {
        console.error("Error: Item sin URL de video", item);
        return;
    }

    const url = item.url;
    const titulo = item.titulo || "Hood Video";

    // Usamos el puente que ya tienes configurado en tu WebView
    if (window.AndroidInterface && window.AndroidInterface.playVideo) {
        console.log("Lanzando a ExoPlayer:", titulo);
        window.AndroidInterface.playVideo(url, titulo);
    } else {
        // Esto es lo que verás si pruebas la App en el navegador de la PC
        console.log("MODO PC (Simulación):", {
            accion: "Reproducir",
            titulo: titulo,
            url: url
        });
        alert("Simulación PC: Reproduciendo " + titulo);
    }
};
        const State = {
    view: 'home', 
    source: 'tv', 
    catalog: {},
    fila: 0, 
    col: 0, 
    menu: false, 
    idxMenu: 0,
    currentGridCat: null,
    resultsCount: 0, // <--- AÑADE ESTO
            secciones: [
                 { id: 'buscar', label: 'BUSCAR' },
                { id: 'tv', label: 'TELEVISIÓN' },
                { id: 'peliculas', label: 'PELÍCULAS' },
                { id: 'series', label: 'SERIES' },
                { id: 'adultos', label: 'ADULTOS' }
            ]
        };
        
  // En tu INDEX.HTML
// Variable global para evitar el doble Enter accidental
window.reproducirItemDeBusqueda = (url, nombre, itemData) => {
    if (!url) return;

    // Mejoramos la detección de TV
    const esTV = (itemData.grupo && itemData.grupo.toUpperCase().includes('TV')) || 
                 (itemData.logo && !itemData.poster) || 
                 itemData.tipo === 'tv';

    if (esTV) {
        if (window.cerrarBuscador) window.cerrarBuscador(); // ¡Cerramos para ver la TV limpia!
        window.reproducir({ url: url, titulo: nombre });
    } else {
        if (window.cerrarBuscador) window.cerrarBuscador();

        State.view = 'details';
        State.col = 0; 
        State.source = (itemData.episodios || itemData.temporadas) ? 'series' : 'peliculas';

        // Aumentamos el tiempo a 300ms para que el buscador termine de irse
        setTimeout(() => {
            if (window.AppController && window.AppController.abrirDetalle) {
                window.AppController.abrirDetalle({
                    ...itemData,
                    name: nombre,
                    logo: itemData.poster || itemData.logo,
                    grupo: itemData.grupo || (State.source === 'series' ? 'Series' : 'Películas')
                });
            }
        }, 300); 
    }
};
        // abre el teclado y cierra menu
 function abrirBuscador() {
    const panel = document.getElementById('search-panel');
    const resultsContainer = document.getElementById('search-results-container');
    
    // Limpiamos resultados viejos al abrir
    if (resultsContainer) resultsContainer.innerHTML = "";
    
    State.view = 'search';
    State.menu = false;
    State.col = 0; 

    panel.style.zIndex = "9000"; 
    panel.classList.add('open');
    
    if (window.SearchController) {
        SearchController.renderKeyboard();
    }

    // Le damos un poco más de tiempo para que el DOM esté listo
    setTimeout(() => {
        window.updateFocus();
    }, 250); 
}
function cerrarBuscador() {
    const panel = document.getElementById('search-panel');
    
    panel.classList.remove('open'); 
    
    // --- NUEVO: Esto manda el buscador al fondo cuando se cierra ---
    // Así no interfiere con los botones del modal de detalles
    setTimeout(() => {
        panel.style.zIndex = "1000";
    }, 300); // Esperamos a que termine la animación de cierre

    State.view = 'home';
    State.menu = true; 
    
    updateFocus();
}
        function bootstrap() {
            const status = document.getElementById('loading-status');
            
            if (window.m3uTV || window.m3uVOD) {
                try {
                    if(window.m3uTV) {
                        State.catalog.tv = ContentParser.parsearTV(window.m3uTV);
                    }
                    
                    if(window.m3uVOD) {
                        const vod = ContentParser.parsearVOD(window.m3uVOD);
                        State.catalog.peliculas = vod.peliculas;
                        State.catalog.series = vod.series;
                        State.catalog.adultos = vod.adultos;
                    }

                    document.getElementById('menu-list').innerHTML = State.secciones.map((s, i) => 
                        `<div id="menu-${i}" class="p-4 px-6 text-xl font-bold italic uppercase tracking-widest text-zinc-500 rounded-xl menu-item">${s.label}</div>`
                    ).join('');

                    AppController.renderHome();
                    document.getElementById('loading').style.display = 'none';
                    updateFocus();

                } catch(e) {
                    status.innerHTML = `<span class="text-red-500 uppercase">Error: ${e.message}</span>`;
                    console.error(e);
                }
            } else {
                status.innerHTML = `<span class="text-red-500 font-bold uppercase tracking-widest">Esperando Listas M3U...</span>`;
                setTimeout(bootstrap, 1000);
            }
        }

function updateFocus() {
    document.querySelectorAll('.focused').forEach(e => e.classList.remove('focused'));
    
    const menu = document.getElementById('side-menu');
    const main = document.getElementById('app-content');
    const modal = document.getElementById('modal-full');

    // 1. GESTIÓN DEL MODAL (Detalles o Grilla)
    if (modal && !modal.classList.contains('hidden')) {
        
        // CASO A: Estamos viendo el DETALLE de una película/serie
        if (State.view === 'details') {
            const modalElements = modal.querySelectorAll('#btn-play, .btn-action, .card, [id^="sug-"], [id^="ep-"], [id^="range-"]');
            const activeElement = modalElements[State.col];

            if (activeElement) {
                activeElement.classList.add('focused');
                
                // Lógica de persiana para sugerencias
                const sugerenciasSeccion = document.getElementById('sugerencias-seccion');
                const modalContent = document.querySelector('#modal-full .relative.z-10');
                if (activeElement.id.startsWith('sug-')) {
                    if (sugerenciasSeccion) sugerenciasSeccion.classList.add('subir-sugerencias');
                    if (modalContent) modalContent.classList.add('subir-sugerencias-active');
                } else {
                    if (sugerenciasSeccion) sugerenciasSeccion.classList.remove('subir-sugerencias');
                    if (modalContent) modalContent.classList.remove('subir-sugerencias-active');
                }

                const rowContainer = activeElement.closest('.similares-container, #contenedor-episodios');
                if (rowContainer) {
                    const scrollPos = activeElement.offsetLeft - 150;
                    rowContainer.scrollTo({ left: scrollPos, behavior: 'smooth' });
                } else {
                    activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        } 
        // CASO B: Estamos viendo la GRILLA de "Ver más"
        else if (State.view === 'grid') {
            const activeElement = document.getElementById(`card-grid-${State.col}`);
            if (activeElement) {
                activeElement.classList.add('focused');
                activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        return; // Bloqueamos el foco del Home/Menú si el modal está arriba
    }

    // 2. LÓGICA DEL MENÚ LATERAL
    if (State.menu) {
        if (menu) menu.style.transform = 'translateX(0)';
        if (main) main.style.opacity = '0.3';
        const el = document.getElementById(`menu-${State.idxMenu}`);
        if(el) el.classList.add('focused');
        return;
    } 

    if (menu) menu.style.transform = 'translateX(-100%)';
    if (main) main.style.opacity = '1';

    // 3. VISTAS DEL HOME Y BUSCADOR
    let activeElement = null;

    if (State.view === 'search') {
        activeElement = document.getElementById(`key-${State.col}`);
    } 
    else if (State.view === 'search_results') {
        activeElement = document.getElementById(`res-${State.col}`);
    }
    else if (State.view === 'home') {
        activeElement = document.getElementById(`card-${State.fila}-${State.col}`);
    }

    if (activeElement) {
        activeElement.classList.add('focused');
        activeElement.scrollIntoView({ 
            behavior: 'smooth', 
            block: (State.view === 'home') ? 'center' : 'nearest', 
            inline: 'center' 
        });
    }
}
window.addEventListener('keydown', (e) => {
    if (!window.DPad || !window.DPad.handlers) return;

    // 1. EL GLOBAL PRIMERO: Si es un botón de "Atrás", procesamos y CORTAMOS
    // Esto evita que al cerrar un modal se ejecute también la lógica de lo que hay atrás
    const backKeys = ['Escape', 'Back', 'Backspace'];
    if (backKeys.includes(e.key) && document.activeElement.tagName !== 'INPUT') {
        if (window.DPad.handlers.global) {
            window.DPad.handlers.global(e);
            
            // Forzamos la actualización después del cierre
            if (typeof updateFocus === 'function') updateFocus();
            return; // <--- VITAL: Aquí cortamos la ejecución
        }
    }

    // 2. Lógica por vistas: Detalle, Menú, Búsqueda o Home
    if (State.view === 'details') {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) e.preventDefault();
        window.DPad.handlers.details(e);
    } 
    else if (State.menu) {
        // Si el menú está abierto, las flechas van al handler del menú
        window.DPad.handlers.menu(e);
    } 
    else if (State.view === 'search') {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        window.DPad.handlers.search(e);
    } 
    else if (State.view === 'search_results') {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        window.DPad.handlers.search_results(e);
    } 
    else {
        // Este es el caso para 'home' o 'grid'
        const currentHandler = window.DPad.handlers[State.view];
        if (currentHandler) {
            currentHandler(e);
        }
    }

    // 3. Actualizamos el foco visual al final de cada pulsación
    if (typeof updateFocus === 'function') updateFocus();
});
     window.onload = bootstrap;
     // Esta función sirve para que el buscador se quite de en medio antes de abrir el detalle
window.seleccionarDesdeBusqueda = function(item) {
    // Solo reseteamos el índice para que el foco caiga en "Reproducir"
    State.col = 0; 
    State.view = 'details';
    
    // Abrimos el detalle directamente (el buscador se queda "debajo" en pausa)
    AppController.abrirDetalle(item);
};
const CONFIG = {
    parentalPin: "1234", // Tu contraseña
    adultCategories: ["ADULTOS", "XXX", "PORNO", "HOT"] // Nombres de tus categorías
};
    </script>
