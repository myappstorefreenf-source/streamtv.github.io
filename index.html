<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MovieTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Bloqueo total de movimiento */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed; /* Crucial para Android WebView */
            background-color: #000;
            overscroll-behavior: none; /* Elimina el efecto rebote */
        }

        /* Contenedor que ignora el scroll y se ancla a las 4 esquinas */
        #root {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .player-wrapper {
            position: relative;
            flex-grow: 1; /* Ocupa todo el espacio disponible */
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        /* Ajuste del video para que no se estire feo */
        video, .react-player {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important; /* Mantiene la proporción original */
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script> 

    <script type="text/babel" src="tvuno.jsx"></script>

    <script>
        // Función para arreglar el tamaño en móviles dinámicamente
        function fixFullHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            
            // Forzar que el body mida lo que mide la ventana real
            document.body.style.height = window.innerHeight + 'px';
            window.scrollTo(0, 0);
        }

        window.addEventListener('resize', fixFullHeight);
        window.addEventListener('orientationchange', fixFullHeight);
        fixFullHeight();

        // Bloqueo de scroll por JS (doble seguridad)
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) return; // Permitir zoom si fuera necesario
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
