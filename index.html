    <title>MovieTube</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Estilos corregidos */
    .player-wrapper {
        position: relative;
        /* Hacemos que ocupe toda la altura de la ventana */
        height: 100vh; 
        width: 100%;
        background-color: black; /* Aseguramos que el fondo sea negro si no hay video */
        overflow: hidden; /* Prevenimos barras de scroll innecesarias */
    }
    .react-player {
        position: absolute;
        top: 0;
        left: 0;
        /* ¡CRÍTICO! Forzar 100% de tamaño */
        width: 100% !important;
        height: 100% !important;
        object-fit: contain; /* Asegura que el stream se ajuste bien */
    }
</style>

  </head>
